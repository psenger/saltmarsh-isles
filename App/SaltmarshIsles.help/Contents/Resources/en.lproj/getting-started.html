<h1>Getting started</h1>
<p>Everyone rolls to see who goes first. Ties roll again.</p>
<p>Each player places two settlements, with a road beside each, going round the table and then back the other way.</p>
<p>Your second settlement pays you a card from every tile touching it.</p>
