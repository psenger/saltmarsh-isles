<h1>The goal</h1>
<p>First to 10 points on their own turn takes the isles.</p>
<p>A settlement is worth 1 point and a city 2. Longest road and largest army are worth 2 each.</p>
<p>Each Victory point card is worth 1, and stays hidden until you win.</p>
