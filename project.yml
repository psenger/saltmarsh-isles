name: SaltmarshIsles
options:
  bundleIdPrefix: dev.psenger
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  SaltmarshCore:
    path: .
targets:
  SaltmarshIsles:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes: [Info.plist, SaltmarshIsles.help]
      - path: App/SaltmarshIsles.help
        type: folder
        buildPhase: resources
        destinationFilters: [macOS]
    dependencies:
      - package: SaltmarshCore
        product: SaltmarshEngine
      - package: SaltmarshCore
        product: SaltmarshAI
      - package: SaltmarshCore
        product: SaltmarshGame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.psenger.SaltmarshIsles
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # A real iPhone will not run an app signed with "-". Kept here because `make project` rewrites the project.
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
        DEVELOPMENT_TEAM: F728VX3G8A
        ENABLE_PREVIEWS: YES
  AppUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources: [AppUITests]
    dependencies:
      - target: SaltmarshIsles
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
