name: SaltmarshIsles
options:
  bundleIdPrefix: dev.psenger
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  SaltmarshCore:
    path: .
targets:
  SaltmarshIsles:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes: [Info.plist, SaltmarshIsles.help]
      - path: App/SaltmarshIsles.help
        type: folder
        buildPhase: resources
        destinationFilters: [macOS]
    dependencies:
      - package: SaltmarshCore
        product: SaltmarshEngine
      - package: SaltmarshCore
        product: SaltmarshAI
      - package: SaltmarshCore
        product: SaltmarshGame
    # Every build is stamped in the built app only (nothing in the repo changes): the build number is the
    # date and time, yyyyMMdd.HHmm, and SaltmarshBuilt says it in words for the About screen. CFBundleName is
    # set here because the generated Info.plist always writes the product name, SaltmarshIsles, over it.
    postBuildScripts:
      - name: Stamp the name, build number and build date
        basedOnDependencyAnalysis: false
        script: |
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          plutil -replace CFBundleName -string "Saltmarsh Isles" "$PLIST"
          plutil -replace CFBundleVersion -string "$(date +%Y%m%d.%H%M)" "$PLIST"
          plutil -replace SaltmarshBuilt -string "$(LC_ALL=C date '+%-d %b %Y at %H:%M')" "$PLIST"
    # Your signing team goes in the untracked Config/Local.xcconfig (see the README).
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        # The name people see: About, the Mac app menu, the iPhone home screen. The bundle stays SaltmarshIsles.app.
        INFOPLIST_KEY_CFBundleDisplayName: "Saltmarsh Isles"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # A real iPhone will not run an app signed with "-". Kept here because `make project` rewrites the project.
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
        ENABLE_PREVIEWS: YES
  AppUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources: [AppUITests]
    dependencies:
      - target: SaltmarshIsles
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
